<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Harpreet Singh — Salesforce QA Analyst</title>
<style>
  :root{
    --navy-deep:#0B2545;
    --navy-mid:#123A6B;
    --sky:#1B98E0;
    --gold:#E8B24D;
    --paper:#F5F7FA;
    --white:#FFFFFF;
    --ink:#1A1F2B;
    --ink-soft:#5B6472;
    --line:#E1E6ED;
    --radius:10px;
    --max:1120px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    color:var(--ink);
    background:var(--white);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{
    font-family:'Sora','Inter',sans-serif;
    font-weight:700;
    margin:0;
    letter-spacing:-0.01em;
  }
  .mono{
    font-family:'IBM Plex Mono','Courier New',monospace;
  }
  a{color:inherit;text-decoration:none;}
  .wrap{max-width:var(--max);margin:0 auto;padding:0 32px;}
  img{max-width:100%;display:block;}

  /* ===== Header ===== */
  header{
    position:sticky;top:0;z-index:50;
    background:rgba(11,37,69,0.96);
    backdrop-filter:blur(6px);
  }
  .nav{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 32px;max-width:var(--max);margin:0 auto;
  }
  .brand{
    display:flex;align-items:center;gap:10px;
    color:var(--white);font-size:18px;font-weight:700;
  }
  .brand .dot{
    width:10px;height:10px;border-radius:50%;
    background:var(--sky);
    box-shadow:0 0 0 4px rgba(27,152,224,0.25);
  }
  nav.links{display:flex;gap:32px;}
  nav.links a{
    color:rgba(255,255,255,0.78);
    font-size:14px;font-weight:600;
    letter-spacing:0.02em;
    transition:color 0.2s;
  }
  nav.links a:hover{color:var(--white);}
  .nav-cta{
    background:var(--sky);color:var(--navy-deep);
    padding:9px 18px;border-radius:6px;
    font-size:14px;font-weight:700;
    transition:transform 0.15s, box-shadow 0.15s;
  }
  .nav-cta:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(27,152,224,0.35);}
  .nav-toggle{display:none;background:none;border:none;color:var(--white);font-size:26px;cursor:pointer;}

  /* ===== Hero ===== */
  .hero{
    background:
      radial-gradient(circle at 82% 12%, rgba(27,152,224,0.35), transparent 45%),
      radial-gradient(circle at 15% 85%, rgba(232,178,77,0.18), transparent 40%),
      linear-gradient(180deg,var(--navy-deep) 0%, var(--navy-mid) 100%);
    color:var(--white);
    padding:96px 0 110px;
    position:relative;
    overflow:hidden;
  }
  .hero-grid{
    display:grid;grid-template-columns:1.1fr 0.9fr;gap:56px;align-items:center;
  }
  .eyebrow{
    display:inline-flex;align-items:center;gap:8px;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;letter-spacing:0.08em;text-transform:uppercase;
    color:var(--gold);
    border:1px solid rgba(232,178,77,0.4);
    padding:6px 12px;border-radius:20px;
    margin-bottom:22px;
  }
  .hero h1{
    font-size:48px;line-height:1.12;color:var(--white);
    margin-bottom:18px;
  }
  .hero h1 span{color:var(--sky);}
  .hero p.lead{
    font-size:17px;line-height:1.65;color:rgba(255,255,255,0.75);
    max-width:520px;margin-bottom:32px;
  }
  .hero-actions{display:flex;gap:14px;flex-wrap:wrap;}
  .btn{
    display:inline-block;padding:13px 26px;border-radius:6px;
    font-size:14px;font-weight:700;letter-spacing:0.01em;
    transition:transform 0.15s, box-shadow 0.15s;
  }
  .btn-primary{background:var(--sky);color:var(--navy-deep);}
  .btn-primary:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(27,152,224,0.4);}
  .btn-ghost{border:1px solid rgba(255,255,255,0.3);color:var(--white);}
  .btn-ghost:hover{border-color:var(--white);background:rgba(255,255,255,0.06);}

  /* org card visual */
  .org-card{
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.14);
    border-radius:14px;
    padding:26px;
    backdrop-filter:blur(4px);
  }
  .org-card .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
  .org-card .top .tag{
    font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--gold);
    letter-spacing:0.06em;
  }
  .org-card .status{
    display:flex;align-items:center;gap:6px;font-size:12px;color:#8FE3A0;
  }
  .org-card .status .dot{width:7px;height:7px;border-radius:50%;background:#8FE3A0;}
  .stat-row{display:flex;justify-content:space-between;padding:12px 0;border-top:1px solid rgba(255,255,255,0.1);}
  .stat-row:first-of-type{border-top:none;}
  .stat-row .label{font-size:13px;color:rgba(255,255,255,0.6);}
  .stat-row .value{font-size:14px;font-weight:700;color:var(--white);font-family:'IBM Plex Mono',monospace;}
  .bar{height:6px;border-radius:4px;background:rgba(255,255,255,0.12);overflow:hidden;margin-top:6px;}
  .bar > div{height:100%;background:linear-gradient(90deg,var(--sky),var(--gold));}

  /* ===== Section shell ===== */
  section{padding:88px 0;}
  .section-head{max-width:600px;margin-bottom:52px;}
  .section-head .eyebrow-light{
    font-family:'IBM Plex Mono',monospace;font-size:12px;
    letter-spacing:0.08em;text-transform:uppercase;color:var(--sky);
    margin-bottom:10px;display:block;
  }
  .section-head h2{font-size:32px;color:var(--navy-deep);margin-bottom:14px;}
  .section-head p{color:var(--ink-soft);font-size:15.5px;line-height:1.6;}

  /* ===== About / Skills ===== */
  .about{background:var(--paper);}
  .about-grid{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:start;}
  .about-text p{color:var(--ink-soft);font-size:15.5px;line-height:1.75;margin-bottom:16px;}
  .skill-groups{display:flex;flex-direction:column;gap:18px;}
  .skill-group{
    background:var(--white);border:1px solid var(--line);
    border-radius:var(--radius);padding:18px 20px;
  }
  .skill-group h4{font-size:13px;text-transform:uppercase;letter-spacing:0.05em;color:var(--navy-mid);margin-bottom:10px;}
